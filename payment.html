<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Payment Details | Aprils Signature</title><meta content="Aprils Signature payment details." name="description"/><link href="css/style.css" rel="stylesheet"/><style>.payment-details-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.payment-account-card{height:100%}@media(max-width:760px){.payment-details-grid{grid-template-columns:1fr}}</style></head><body class="payment-page"><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><img alt="Aprils Signature logo" class="brand-logo" src="icons/Aprils Signature logo.jpeg"/><span class="brand-text"><span class="brand-name">Aprils Signature</span><span class="brand-tagline">Elegance in Every Stitch</span></span></a><button aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Main navigation" class="main-navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="services.html">Services</a><a href="gallery.html">Gallery</a><a href="shop.html">Shop</a><a href="training.html">Training</a><a href="quotes.html">Order / Request a Quote</a><a href="policies.html">Policies &amp; Terms</a><a href="contact.html">Contact</a></nav></div></header><main><section class="page-intro"><div class="container"><h1>Payment Details</h1><p>Use the payment details below to complete your Aprils Signature payment.</p></div></section><section class="service-section"><div class="container"><div class="services-grid payment-details-grid" id="paymentDetails"><div class="empty">Loading payment details…</div></div></div></section></main><footer class="site-footer"><div class="footer-bottom"><div class="container"><p>© <span id="copyrightYear"></span> Aprils Signature. All rights reserved.</p></div></div></footer><script src="js/supabase-config.js?v=20260826-media-sync"></script><script src="js/supabase-client.js?v=20260826-media-sync"></script><script defer="" src="js/script.js?v=20260826-media-sync"></script><script>
(function(){
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const wait=()=>new Promise(resolve=>{let n=0;const t=setInterval(()=>{const d=window.aprilsSupabase;if(d||++n>100){clearInterval(t);resolve(d||null)}},100)});
  async function load(){lhgh
    const box=document.getElementById('paymentDetails');const d=await wait();
    if(!d){box.innerHTML='<div class="empty">Payment details are temporarily unavailable.</div>';return}
    try{
      const r=await d.from('public_payment_details').select('network,number,name,bank,branch,display_order').eq('active',true).order('display_order',{ascending:true});
      if(r.error)throw r.error; const a=r.data||[];
      if(!a.length){box.innerHTML='<div class="empty">Payment details have not been saved yet.</div>';return}
      box.innerHTML=a.map(x=>'<article class="service-card payment-account-card"><h3>'+esc(x.network||'Payment Method')+'</h3><p><strong>Account / Number:</strong> '+esc(x.number||'')+'</p><p><strong>Account Name:</strong> '+esc(x.name||'')+'</p>'+(x.bank?'<p><strong>Bank:</strong> '+esc(x.bank)+'</p>':'')+(x.branch?'<p><strong>Branch:</strong> '+esc(x.branch)+'</p>':'')+'</article>').join('');
    }catch(e){console.error(e);box.innerHTML='<div class="empty">Payment details are temporarily unavailable.</div>'}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load);else load();
})();
</script></script><script src="js/pwa-register.js"></script></body></html>
