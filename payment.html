<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aprils Signature</title><script src="js/supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f6f6f6;color:#111}.card{max-width:720px;margin:50px auto;background:#fff;padding:32px;border:1px solid #ddd;border-radius:8px}</style></head><body><main class="card"><h1>Aprils Signature</h1><h2>Payment Details</h2><div id="status">Loading payment details…</div><div id="details"></div></main><script>(async()=>{const q=new URLSearchParams(location.search),ref=q.get('ref');const status=document.getElementById('status'),out=document.getElementById('details');if(!ref){status.textContent='This payment link is invalid.';return}let data=null;try{data=JSON.parse(localStorage.getItem('aprils_payment_'+ref)||'null')}catch{};const c=window.APRILS_SUPABASE_CONFIG;if(!data&&window.supabase&&c?.url){try{const s=window.supabase.createClient(c.url,c.publishableKey);const r=await s.from('settings').select('setting_value').eq('setting_key','payment_share_'+ref).maybeSingle();data=r.data?.setting_value||null}catch(e){}}if(!data){status.textContent='Payment details could not be found for this link.';return}status.remove();out.innerHTML=Object.entries(data).filter(([k])=>!['token','saved_at'].includes(k)).map(([k,v])=>'<p><strong>'+k.replaceAll('_',' ')+':</strong> '+String(v).replace(/[&<>]/g,'')+'</p>').join('')})()</script></body></html>
