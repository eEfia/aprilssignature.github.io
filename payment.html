<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Details | Aprils Signature</title><link rel="stylesheet" href="css/style.css"></head><body><main><section class="page-intro"><div class="container"><h1>Payment Details</h1><p>Use the payment details below to complete your Aprils Signature payment.</p></div></section><section class="service-section"><div class="container"><div id="paymentDetails" class="services-grid"><div class="empty">Loading payment details…</div></div></div></section></main><script src="js/supabase-config.js"></script><script src="js/supabase-client.js"></script><script>(async()=>{const wait=()=>new Promise(r=>{let n=0;const t=setInterval(()=>{if(window.aprilsSupabase||++n>100){clearInterval(t);r(window.aprilsSupabase||null)}},100)});const d=await wait();const box=document.getElementById('paymentDetails');if(!d){box.innerHTML='<div class="empty">Payment details are temporarily unavailable.</div>';return}let a=[];try{const direct=await d.from('settings').select('setting_value').eq('setting_key','invoice_payment_accounts').maybeSingle();const v=JSON.parse(direct.data?.setting_value||'[]');if(Array.isArray(v))a=v;}catch(_){}if(!a.length){try{const r=await d.from('settings').select('setting_value').eq('setting_key','site_link_payment').maybeSingle();const v=JSON.parse(r.data?.setting_value||'{}');a=Array.isArray(v)?v:(v.accounts||[])}catch(_){}}
if(!a.length){box.innerHTML='<div class="empty">Payment details have not been saved yet.</div>';return}box.innerHTML=a.max=>`<article class="service-card"><h3>${String(x.network||'Payment Method').replace(/[&<>]/g,'')}</h3><p><strong>Account / Number:</strong> ${String(x.number||'').replace(/[&<>]/g,'')}</p><p><strong>Name:</strong> ${String(x.name||'').replace(/[&<>]/g,'')}</p>${x.note?`<p>${String(x.note).replace(/[&<>]/g,'')}</p>`:''}</article>`).join('')})()</script></body></html>
